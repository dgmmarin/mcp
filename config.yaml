# ─────────────────────────────────────────────────────────────────
#  Bridges Inspections Intel Agent — Runtime Configuration
# ─────────────────────────────────────────────────────────────────

# ── Model ─────────────────────────────────────────────────────────
model: qwen3.5:9b
# Alternatives for 8 GB VRAM:
#   qwen3:8b-q4_K_M   → ~4.5 GB, slightly lower quality
#   qwen3:14b-q4_K_M  → ~8 GB, close to VRAM ceiling

temperature: 0.15       # low = reliable JSON tool calls
max_steps: 15           # hard cap on agentic loop iterations
verbose: true

# ── MCP Server (HTTP/Streamable-HTTP transport) ───────────────────
# Start the server first: npm run build && node dist/index.js
mcp:
  url: http://127.0.0.1:3333/mcp

# ── Pagination defaults ───────────────────────────────────────────
default_limit: "10"    # string — MCP schema expects strings

# ── Memory ───────────────────────────────────────────────────────
memory_dir: memory/
