services:
  mcp-server:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3333:3333"
    environment:
      - MCP_HOST=0.0.0.0
      - MCP_PORT=3333
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3333/mcp"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
